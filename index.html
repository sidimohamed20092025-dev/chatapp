<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Gemini Chat</title>
<meta name="description" content="A simple ChatGPT-style chat app powered by your own Google Gemini API key.">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))</script>
<script src="app.js" defer></script>
<style>
:root{--bg:#fff;--fg:#1a1b22;--card:#f0f1f5;--me:#4f46e5;--bd:#dcdde5;--mut:#6b6f7b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--fg:#ececf1;--card:#1b1e29;--bd:#2b2f3c;--mut:#9a9eab}}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd)}
h1{flex:1;margin:0;font-size:18px}
button{font:inherit;color:inherit;background:none;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--me)}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:4px}
.b{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
.err{border:1px solid #e5484d;color:#e5484d}
pre{background:rgba(127,127,127,.18);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0;white-space:pre}
code{font-family:ui-monospace,monospace;font-size:.9em}
#f{display:flex;gap:8px;align-items:flex-end;padding:10px 14px;border-top:1px solid var(--bd)}
#t{flex:1;resize:none;max-height:140px;font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}
#s{background:var(--me);color:#fff;border:0;border-radius:14px;padding:11px 16px}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:16px;width:min(92vw,420px)}
dialog h2{margin:0 0 6px;font-size:18px}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:14px}
input{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.note{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
</style>
</head>
<body>
<header><h1>Gemini Chat</h1><button id="n">New chat</button><button id="gear" aria-label="Settings">⚙</button></header>
<main id="log" aria-live="polite"></main>
<div id="f"><textarea id="t" rows="1" placeholder="Message Gemini"></textarea><button id="s">Send</button></div>
<dialog id="dlg"><form method="dialog">
<h2>Settings</h2>
<label for="k">Gemini API key</label><input id="k" type="password" autocomplete="off" placeholder="AIza...">
<label for="m">Model</label><input id="m" list="ml" placeholder="gemini-2.5-flash"><datalist id="ml"><option value="gemini-2.5-flash"><option value="gemini-2.5-pro"><option value="gemini-2.5-flash-lite"></datalist>
<p class="note">Stored only on this device and sent only to Google. Get a key at aistudio.google.com/apikey</p>
<div class="row"><button type="button" id="c">Cancel</button><button id="ok">Save</button></div>
</form></dialog>
</body>
</html>
